<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Master - Anime & Valorant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 700px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 0.5rem;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .content {
      padding: 2rem;
    }

    .menu {
      display: grid;
      gap: 1rem;
    }

    .menu-btn {
      padding: 1.5rem;
      border: 2px solid #667eea;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s;
      color: #667eea;
    }

    .menu-btn:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
    }

    .game-container {
      display: none;
    }

    .game-container.active {
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }

    .score-display {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .score-card {
      flex: 1;
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }

    .score-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .score-value {
      font-size: 28px;
      font-weight: 600;
      color: #667eea;
    }

    .question-card {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .question-title {
      font-size: 14px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }

    .clues-section {
      margin-bottom: 1.5rem;
    }

    .clue {
      background: white;
      border-left: 3px solid #667eea;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1.6;
    }

    .clue strong {
      color: #667eea;
      font-weight: 600;
    }

    .skin-image {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      background: #f0f0f0;
      padding: 1rem;
    }

    .guess-input {
      width: 100%;
      padding: 12px 1rem;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .guess-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
    }

    button {
      flex: 1;
      padding: 12px 1rem;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .skip-btn {
      background: #f0f0f0;
      color: #666;
      border: 1px solid #ddd;
    }

    .skip-btn:hover {
      background: #e8e8e8;
    }

    .result-section {
      border-left: 3px solid;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    .result-correct {
      background: #e8f5e9;
      border-color: #4caf50;
    }

    .result-incorrect {
      background: #ffebee;
      border-color: #f44336;
    }

    .result-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .result-correct .result-title {
      color: #2e7d32;
    }

    .result-incorrect .result-title {
      color: #c62828;
    }

    .result-text {
      margin: 0.25rem 0;
      color: #333;
    }

    .game-over {
      text-align: center;
    }

    .game-over h2 {
      color: #333;
      margin-bottom: 1rem;
    }

    .final-score {
      font-size: 56px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 1rem 0;
    }

    .final-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 2rem;
    }

    .percentage {
      font-size: 20px;
      color: #999;
      margin: 0.5rem 0;
    }

    .back-btn {
      background: #f0f0f0;
      color: #666;
      border: 1px solid #ddd;
      width: 100%;
      margin-top: 1rem;
    }

    .back-btn:hover {
      background: #e8e8e8;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .content {
        padding: 1.5rem;
      }

      .score-display {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎮 Guess Master</h1>
    <p>Choose your game mode</p>
  </div>

  <div class="content" id="mainContent"></div>
</div>

  { clues: ["Monster detective mystery", "Johan becomes primary suspect", "Psychological thriller"], answer: "Monster" },
  { clues: ["Music production and romance", "Carole and Tuesday perform", "Mars colony setting"], answer: "Carole & Tuesday" },
  { clues: ["School harem comedy", "Summer festival romance", "Tsundere love interest"], answer: "Toradora!" },
  { clues: ["Magical girl transformation power", "Battle against dark forces", "Sailor Moon's adventure"], answer: "Sailor Moon" },
  { clues: ["Elf archer fantasy quest", "Guild adventures and battles", "Sword and sorcery setting"], answer: "Goblin Slayer" },
  { clues: ["Zombie survival post-apocalypse", "Undead human girl Mitsuri", "Gruesome horror action"], answer: "Highschool of the Dead" },

  { name: "Prime Vandal", image: "https://media.valorant-api.com/weaponskins/9c06889c-4deb-ee3a-2e9d-8897162e5c34/displayicon.png", rarity: 5 },

  { name: "Oni Phantom", image: "https://media.valorant-api.com/weaponskins/8361c3f9-4767-ebec-27e7-a8e67e40725f/displayicon.png", rarity: 4 },
  { name: "Spectrum Vandal", image: "https://media.valorant-api.com/weaponskins/bac86e84-4e8f-a373-0c84-3a11a10ebe0e/displayicon.png", rarity: 3 },
  { name: "Chronovoid Operator", image: "https://media.valorant-api.com/weaponskins/84e77440-4a0c-99be-ecb1-6e23e2c51b7d/displayicon.png", rarity: 3 },
  { name: "BlastX Vandal", image: "https://media.valorant-api.com/weaponskins/5228c3a8-4b83-8386-d204-06aaacb0ba21/displayicon.png", rarity: 3 },
  { name: "Dogma Phantom", image: "https://media.valorant-api.com/weaponskins/54cfdde7-41ea-4e2a-81bb-bfd40e7b18b5/displayicon.png", rarity: 3 },
  { name: "Radianite Phantom", image: "https://media.valorant-api.com/weaponskins/e0db3642-4d4d-aca0-0e21-138591167050/displayicon.png", rarity: 3 },
  { name: "Glitchpop Vandal", image: "https://media.valorant-api.com/weaponskins/ee8e8d15-496b-07de-1e9d-979386f3d841/displayicon.png", rarity: 4 },
  { name: "Protocol G3 Phantom", image: "https://media.valorant-api.com/weaponskins/a42a43d5-4b0c-2ba1-b156-fb7cd7be1c9d/displayicon.png", rarity: 4 },
  { name: "Araxys Vandal", image: "https://media.valorant-api.com/weaponskins/055aaeea-41ea-e1d6-95b0-ccb64ca1a704/displayicon.png", rarity: 4 },
  { name: "Araxys Operator", image: "https://media.valorant-api.com/weaponskins/37a3c5ef-495d-e5e6-e957-b49c7b68b3e0/displayicon.png", rarity: 4 },
  { name: "Ion Phantom", image: "https://media.valorant-api.com/weaponskins/79974cee-41f4-44c1-89ec-5890d6e12fbc/displayicon.png", rarity: 4 },
];

let currentGame = null;
let currentQuestion = 0;
let score = 0;
let questions = [];

function showMenu() {
  const content = document.getElementById('mainContent');
  content.innerHTML = `
    <div class="menu">
      <button class="menu-btn" onclick="startGame('anime')">🎬 Anime Guessing Game</button>
      <button class="menu-btn" onclick="startGame('valorant')">🎮 Valorant Skin Guessing</button>
      <button class="menu-btn" onclick="startGame('mixed')">⚡ Mixed Mode (Both)</button>
    </div>
  `;
}

function startGame(gameType) {
  currentGame = gameType;
  currentQuestion = 0;
  score = 0;

  if (gameType === 'anime') {
    questions = animeQuestions.sort(() => Math.random() - 0.5);
  } else if (gameType === 'valorant') {
    questions = valorantSkins.sort(() => (Math.random() - 0.5) * (Math.random() - 0.5)).slice(0, 20);
  } else {
    questions = [...animeQuestions.sort(() => Math.random() - 0.5).slice(0, 12), ...valorantSkins.sort(() => (Math.random() - 0.5) * (Math.random() - 0.5)).slice(0, 8)];
  }

  renderGame();
}

function renderGame() {
  const content = document.getElementById('mainContent');

  if (currentQuestion >= questions.length) {
    renderGameOver();
    return;
  }

  const q = questions[currentQuestion];
  const progress = ((currentQuestion) / questions.length) * 100;
  const isValorant = q.image;

  content.innerHTML = `
    <div class="progress-bar">
      <div class="progress-fill" style="width: ${progress}%"></div>
    </div>

    <div class="score-display">
      <div class="score-card">
        <div class="score-label">Correct</div>
        <div class="score-value">${score}</div>
      </div>
      <div class="score-card">
        <div class="score-label">Question</div>
        <div class="score-value">${currentQuestion + 1}/${questions.length}</div>
      </div>
    </div>

    <div class="question-card">
      <div class="question-title">${isValorant ? 'What Valorant skin is this?' : 'What anime is this?'}</div>
      ${isValorant ? `<img src="${q.image}" alt="Valorant skin" class="skin-image" onerror="this.style.display='none'">` : ''}
      ${!isValorant ? `<div class="clues-section">
        ${q.clues.map((clue, i) => `<div class="clue"><strong>Clue ${i + 1}:</strong> ${clue}</div>`).join('')}
      </div>` : ''}

      <input
        type="text"
        id="guessInput"
        class="guess-input"
        placeholder="Enter name..."
        autocomplete="off"
      />

      <div class="button-group">
        <button class="submit-btn" onclick="submitGuess()">Submit</button>
        <button class="skip-btn" onclick="skipQuestion()">Skip</button>
      </div>
    </div>
  `;

  setTimeout(() => {
    const input = document.getElementById('guessInput');
    if (input) {
      input.focus();
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitGuess();
      });
    }
  }, 100);
}

function submitGuess() {
  const input = document.getElementById('guessInput');
  const guess = input.value.trim().toLowerCase();
  const q = questions[currentQuestion];
  const correct = q.answer.toLowerCase();

  const content = document.getElementById('mainContent');
  const isCorrect = guess === correct;

  if (isCorrect) score++;

  const progress = (((currentQuestion + 1) / questions.length) * 100);
  const resultHTML = `
    <div class="progress-bar">
      <div class="progress-fill" style="width: ${progress}%"></div>
    </div>

    <div class="score-display">
      <div class="score-card">
        <div class="score-label">Correct</div>
        <div class="score-value">${score}</div>
      </div>
      <div class="score-card">
        <div class="score-label">Question</div>
        <div class="score-value">${currentQuestion + 1}/${questions.length}</div>
      </div>
    </div>

    <div class="result-section ${isCorrect ? 'result-correct' : 'result-incorrect'}">
      <div class="result-title">${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</div>
      <div class="result-text"><strong>Answer:</strong> ${q.answer}</div>
      ${!isCorrect ? `<div class="result-text"><strong>Your guess:</strong> "${input.value}"</div>` : ''}
    </div>

    <button class="submit-btn" onclick="nextQuestion()" style="width: 100%; margin-top: 1rem;">Next →</button>
  `;

  content.innerHTML = resultHTML;
}

function skipQuestion() {
  nextQuestion();
}

function nextQuestion() {
  currentQuestion++;
  renderGame();
}

function renderGameOver() {
  const content = document.getElementById('mainContent');
  const percentage = Math.round((score / questions.length) * 100);

  let message = '';
  if (percentage === 100) message = '🏆 Perfect score! You\'re a master!';
  else if (percentage >= 80) message = '🎯 Excellent work!';
  else if (percentage >= 60) message = '👍 Great job!';
  else if (percentage >= 40) message = '😊 Not bad!';
  else message = '💪 Try again!';

  content.innerHTML = `
    <div class="question-card game-over">
      <h2>Game Over!</h2>
      <div class="final-score">${score} / ${questions.length}</div>
      <div class="percentage">${percentage}%</div>
      <div class="final-message">${message}</div>
      <button class="submit-btn" onclick="showMenu()" style="width: 100%;">Back to Menu</button>
    </div>
  `;
}

showMenu();
</script>

</body>
</html>
