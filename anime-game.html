<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Guess Master</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .game-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 700px;
      overflow: hidden;
    }

    .game-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      text-align: center;
    }

    .game-header h1 {
      font-size: 32px;
      margin-bottom: 0.5rem;
    }

    .game-header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .game-content {
      padding: 2rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }

    .score-display {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .score-card {
      flex: 1;
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }

    .score-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .score-value {
      font-size: 28px;
      font-weight: 600;
      color: #667eea;
    }

    .question-card {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .question-title {
      font-size: 14px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }

    .clues-section {
      margin-bottom: 1.5rem;
    }

    .clue {
      background: white;
      border-left: 3px solid #667eea;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1.6;
    }

    .clue strong {
      color: #667eea;
      font-weight: 600;
    }

    .guess-input {
      width: 100%;
      padding: 12px 1rem;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .guess-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
    }

    button {
      flex: 1;
      padding: 12px 1rem;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .skip-btn {
      background: #f0f0f0;
      color: #666;
      border: 1px solid #ddd;
    }

    .skip-btn:hover {
      background: #e8e8e8;
    }

    .result-section {
      border-left: 3px solid;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    .result-correct {
      background: #e8f5e9;
      border-color: #4caf50;
    }

    .result-incorrect {
      background: #ffebee;
      border-color: #f44336;
    }

    .result-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .result-correct .result-title {
      color: #2e7d32;
    }

    .result-incorrect .result-title {
      color: #c62828;
    }

    .result-text {
      margin: 0.25rem 0;
      color: #333;
    }

    .game-over {
      text-align: center;
    }

    .game-over h2 {
      color: #333;
      margin-bottom: 1rem;
    }

    .final-score {
      font-size: 56px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 1rem 0;
    }

    .final-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 2rem;
    }

    .percentage {
      font-size: 20px;
      color: #999;
      margin: 0.5rem 0;
    }

    @media (max-width: 600px) {
      .game-header h1 {
        font-size: 24px;
      }

      .game-content {
        padding: 1.5rem;
      }

      .score-display {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="game-header">
    <h1>🎬 Anime Guess Master</h1>
    <p>How many can you identify?</p>
  </div>

  <div class="game-content" id="gameContent"></div>
</div>

<script>
const questions = [
  {
    clues: ["Supernatural detective series", "Notebook grants death powers", "Strategic mind games"],
    answer: "Death Note"
  },
  {
    clues: ["Giant humanoid creatures attack humanity", "Scout Regiment fights back", "Founder's identity is a mystery"],
    answer: "Attack on Titan"
  },
  {
    clues: ["Pirate adventure across the Grand Line", "Straw Hat crew seeks treasure", "Rubbery protagonist"],
    answer: "One Piece"
  },
  {
    clues: ["Ninja academy in Hidden Leaf Village", "Ninja with nine-tailed fox power", "Orange-loving protagonist"],
    answer: "Naruto"
  },
  {
    clues: ["Demon slayer organization", "Sister turns into demon", "Sword breathing techniques"],
    answer: "Demon Slayer"
  },
  {
    clues: ["High school battle royale", "Students gain superpowers", "Society separates by quirk"],
    answer: "My Hero Academia"
  },
  {
    clues: ["Alchemy breaks laws of equivalent exchange", "Two brothers search for Philosopher's Stone", "Automail prosthetics"],
    answer: "Fullmetal Alchemist"
  },
  {
    clues: ["Psychic school for gifted students", "Protagonist hides his true power", "Grade: B Class"],
    answer: "Mob Psycho 100"
  },
  {
    clues: ["Battle through mazes of floors", "VR multiplayer reality becomes real", "300 levels to clear"],
    answer: "Sword Art Online"
  },
  {
    clues: ["Titan hunter with special weapons", "Magical girls fight monsters", "Slice of life meets action"],
    answer: "Puella Magi Madoka Magica"
  },
  {
    clues: ["Underground gourmet food hunter", "Appetite demons terrorize world", "Rating scale from 1-100"],
    answer: "Toriko"
  },
  {
    clues: ["Soul collecting shinigami", "Death God runs ramen shop", "Humans and afterlife collide"],
    answer: "Hell Girl"
  }
];

let currentQuestion = 0;
let score = 0;

function renderGame() {
  const content = document.getElementById('gameContent');

  if (currentQuestion >= questions.length) {
    renderGameOver();
    return;
  }

  const q = questions[currentQuestion];
  const progress = ((currentQuestion) / questions.length) * 100;

  content.innerHTML = `
    <div class="progress-bar">
      <div class="progress-fill" style="width: ${progress}%"></div>
    </div>

    <div class="score-display">
      <div class="score-card">
        <div class="score-label">Correct</div>
        <div class="score-value">${score}</div>
      </div>
      <div class="score-card">
        <div class="score-label">Question</div>
        <div class="score-value">${currentQuestion + 1}/${questions.length}</div>
      </div>
    </div>

    <div class="question-card">
      <div class="question-title">What anime is this?</div>
      <div class="clues-section">
        ${q.clues.map((clue, i) => `<div class="clue"><strong>Clue ${i + 1}:</strong> ${clue}</div>`).join('')}
      </div>

      <input
        type="text"
        id="guessInput"
        class="guess-input"
        placeholder="Enter anime title..."
        autocomplete="off"
      />

      <div class="button-group">
        <button class="submit-btn" onclick="submitGuess()">Submit Guess</button>
        <button class="skip-btn" onclick="skipQuestion()">Skip</button>
      </div>
    </div>
  `;

  setTimeout(() => {
    const input = document.getElementById('guessInput');
    if (input) {
      input.focus();
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitGuess();
      });
    }
  }, 100);
}

function submitGuess() {
  const input = document.getElementById('guessInput');
  const guess = input.value.trim().toLowerCase();
  const correct = questions[currentQuestion].answer.toLowerCase();

  const content = document.getElementById('gameContent');
  const isCorrect = guess === correct;

  if (isCorrect) score++;

  const progress = (((currentQuestion + 1) / questions.length) * 100);
  const resultHTML = `
    <div class="progress-bar">
      <div class="progress-fill" style="width: ${progress}%"></div>
    </div>

    <div class="score-display">
      <div class="score-card">
        <div class="score-label">Correct</div>
        <div class="score-value">${score}</div>
      </div>
      <div class="score-card">
        <div class="score-label">Question</div>
        <div class="score-value">${currentQuestion + 1}/${questions.length}</div>
      </div>
    </div>

    <div class="result-section ${isCorrect ? 'result-correct' : 'result-incorrect'}">
      <div class="result-title">${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</div>
      <div class="result-text"><strong>Answer:</strong> ${questions[currentQuestion].answer}</div>
      ${!isCorrect ? `<div class="result-text"><strong>Your guess:</strong> "${input.value}"</div>` : ''}
    </div>

    <button class="submit-btn" onclick="nextQuestion()" style="width: 100%; margin-top: 1rem;">Next Question →</button>
  `;

  content.innerHTML = resultHTML;
}

function skipQuestion() {
  nextQuestion();
}

function nextQuestion() {
  currentQuestion++;
  renderGame();
}

function renderGameOver() {
  const content = document.getElementById('gameContent');
  const percentage = Math.round((score / questions.length) * 100);

  let message = '';
  if (percentage === 100) message = '🏆 Perfect score! You\'re an anime master!';
  else if (percentage >= 80) message = '🎯 Excellent work! You know your anime!';
  else if (percentage >= 60) message = '👍 Great job! Time to watch more anime.';
  else if (percentage >= 40) message = '😊 Not bad! Keep exploring!';
  else message = '💪 Give it another try!';

  content.innerHTML = `
    <div class="question-card game-over">
      <h2>Game Over!</h2>
      <div class="final-score">${score} / ${questions.length}</div>
      <div class="percentage">${percentage}%</div>
      <div class="final-message">${message}</div>
      <button class="submit-btn" onclick="location.reload()" style="width: 100%;">Play Again</button>
    </div>
  `;
}

renderGame();
</script>

</body>
</html>
